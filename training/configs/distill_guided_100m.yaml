model_config: /mnt/volume_d2wey28/models/africa-tts-base/config.yaml
model_overrides:
  flow_lm.transformer.num_layers: 10
  flow_lm.transformer.d_model: 896
  flow_lm.transformer.num_heads: 14
  flow_lm.transformer.hidden_scale: 4
  flow_lm.lookup_table.dim: 896
  flow_lm.z_dim: 1024
  flow_lm.lookup_table.tokenizer: tokenizers
  flow_lm.lookup_table.tokenizer_path: /mnt/volume_d2wey28/projects/liberian-english-speech/unified_guided_tts/tokenizer/ipa_sp4000.json
  flow_lm.lookup_table.n_bins: 4000
start_from_pretrained: false
distill_cfg_coef: 2.0
distill_teacher_config: /mnt/volume_d2wey28/models/africa-tts-base/config.yaml
distill_teacher_overrides:
  flow_lm.lookup_table.tokenizer: tokenizers
  flow_lm.lookup_table.tokenizer_path: /mnt/volume_d2wey28/projects/liberian-english-speech/unified_guided_tts/tokenizer/ipa_sp4000.json
  flow_lm.lookup_table.n_bins: 4000
distill_teacher_weights: /mnt/volume_d2wey28/projects/liberian-english-speech/unified_guided_tts/runs/guided_teacher/best_model.safetensors
data:
  train_jsonl: /mnt/volume_d2wey28/data/unified_guided_tts/manifests/train.jsonl
  valid_jsonl: /mnt/volume_d2wey28/data/unified_guided_tts/manifests/valid.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 5.0
  precompute: true
  loader_procs: 6
flow:
  type: lsd
  kwargs: {}
text_dropout: 0.0
voice_dropout: 0.0
optim:
  lr: 4e-4
  schedule: cosine
  warmup_steps: 1000
run_dir: /mnt/volume_d2wey28/projects/liberian-english-speech/unified_guided_tts/runs/guided_distill_100m
batch_size: 64
grad_accum_steps: 1
max_steps: 100000
ema_decay: 0.9999
log_freq: 50
valid_freq: 2500
num_valid_batches: 50
keep_best_metric: loss
early_stop_patience: 10
ckpt_freq: 5000
num_ckpt_keep: 10
sample_cfg_coef: 1.0
sample_freq: 10000
sample_sentences:
  - "Your people who have died will come back to life!"
  - "Your People Who na Die Will Come Back to Life!"
  - "tɛnɛ paɡɔ ɣa wɔnɔ su ja"
  - "nua tamaa daa ɡaa a ɡɛɛ"
